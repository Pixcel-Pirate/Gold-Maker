<style>
/* Layout: chapter rail on the left (wide screens) or a contents sheet (phones); one page at a time in the reading column. */
:root {
  --bg: #0a0d13;
  --bg-2: #0f141d;
  --panel: #131a25;
  --panel-2: #182130;
  --line: #243045;
  --line-soft: #1b2433;
  --text: #eef2f8;
  --text-2: #b4bfd0;
  --text-3: #7f8ca1;
  --gold: #f4c55a;
  --gold-2: #ffdf8f;
  --gold-ink: #241a03;
  --cyan: #63d6ea;
  --violet: #a597ff;
  --red: #ff7a72;
  --display: "Chakra Petch", "Segoe UI", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: 80px; }
body {
  margin: 0; min-height: 100vh;

    radial-gradient(700px 500px at -10% 110%, rgba(99,214,234,.07), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text); font-family: var(--body); font-weight: 500; font-size: 17px; line-height: 1.6;
  overflow-x: hidden;
}
::selection { background: var(--gold); color: var(--gold-ink); }
a { color: var(--gold); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }

button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* top bar */

.progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: linear-gradient(90deg, var(--gold), var(--gold-2)); box-shadow: 0 0 12px rgba(244,197,90,.55); transition: width .6s var(--ease); }

@media (hover: hover) { .toc a.pg:hover, .toc .home:hover { background: var(--panel); color: var(--text); } }
.toc a.pg[aria-current="page"], .toc .home[aria-current="page"] { background: rgba(244,197,90,.12); color: var(--gold-2); box-shadow: inset 2px 0 0 var(--gold); }

/* page */
.ph { margin-bottom: 26px; }
.ph h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5.4vw, 3rem); line-height: 1.05; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance; }

.notes { list-style: none; margin: 18px 0; padding: 6px 0; counter-reset: n; }
.notes li { position: relative; padding: 14px 20px 14px 58px; border-top: 1px solid var(--line-soft); }
.notes li:first-child { border-top: 0; }
ol.notes li::before { counter-increment: n; content: counter(n, decimal-leading-zero); position: absolute; left: 20px; top: 16px; font-family: var(--mono); font-weight: 700; font-size: .85rem; color: var(--gold); }
ul.notes li::before { content: ""; position: absolute; left: 25px; top: 1.35em; width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); border-radius: 1px; box-shadow: 0 0 10px rgba(244,197,90,.45); }

.row dl { display: grid; grid-template-columns: 7.5em 1fr; gap: 6px 16px; margin: 0; }

/* tier list */
.tiers { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }
.tier { display: grid; grid-template-columns: 76px 1fr; overflow: hidden; }
.tier .tg { display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 2rem; color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); border-right: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
.tier .tg small { display: block; font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-top: -4px; text-align: center; }

.tier li:first-child { border-top: 0; }

/* home */
.hero h1 { font-size: clamp(2.4rem, 7vw, 4rem); }
.hero h1 em { font-style: normal; color: var(--gold); }
.timeline { list-style: none; margin: 30px 0 44px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.phase { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 18px; border-radius: 16px; border: 1px solid var(--line-soft); background: linear-gradient(180deg, var(--panel), var(--bg-2)); transition: border-color .25s, transform .25s var(--ease); }
.phase:hover { border-color: var(--line); transform: translateY(-2px); }
.phase .when { font-family: var(--mono); font-size: .8rem; font-weight: 700; color: var(--text-3); }

.phase.now .when { color: var(--gold); }
.phase.now .when::after { content: "  · you are here"; }
.chapters { list-style: none; margin: 18px 0 0; padding: 0; }
.chapters button { all: unset; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; padding: 16px 20px; border-top: 1px solid var(--line-soft); transition: background-color .2s; }
.chapters li:first-child button { border-top: 0; }
.chapters button:hover { background: rgba(255,255,255,.025); }

.chapters .t { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.chapters .d { display: block; color: var(--text-3); font-size: .92rem; font-family: var(--body); font-weight: 600; }
.chapters .n { font-family: var(--mono); font-size: .8rem; color: var(--text-3); }
h2.sec { font-family: var(--display); font-size: 1.3rem; margin: 34px 0 0; }

/* pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
.pager button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line-soft); background: var(--bg-2); transition: border-color .2s, background-color .2s; }
.pager button:hover { border-color: rgba(244,197,90,.5); background: var(--panel); }
.pager .nx { text-align: right; grid-column: 2; }

/* bottom bar (phones) */
.bar { display: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; cursor: pointer;
  font-weight: 800; font-size: .98rem; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  transition: background-color .2s, border-color .2s, transform .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-ink); border-color: transparent; box-shadow: 0 6px 20px -8px rgba(244,197,90,.7); }
.btn:disabled { opacity: .35; cursor: default; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* contents sheet */
.sheet { position: fixed; inset: 0; z-index: 50; display: none; }
.sheet.open { display: block; }
.sheet .scrim { position: absolute; inset: 0; background: rgba(4,6,10,.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .25s var(--ease); }
.sheet .card { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto; padding: 10px 16px calc(24px + env(safe-area-inset-bottom)); background: var(--bg-2); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; animation: rise .35s var(--ease); }

.sheet .sh { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 6px; }

@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* update prompt (desktop app and installed web app only) */
.upd { display: none; min-height: 38px; padding: 0 14px; font-size: .9rem; }
.upd.show { display: inline-flex; }
.updbox { position: fixed; top: calc(72px + env(safe-area-inset-top)); left: 50%; z-index: 60; width: min(28rem, calc(100vw - 32px)); transform: translateX(-50%); padding: 20px 22px; border-radius: 16px; background: var(--panel-2); border: 1px solid rgba(244,197,90,.45); box-shadow: 0 24px 60px -20px rgba(0,0,0,.8); animation: rise .35s var(--ease); }
.updbox[hidden] { display: none; }
.updbox b { display: block; font-family: var(--display); font-size: 1.2rem; margin-bottom: 4px; }
.updbox p { color: var(--text-2); margin: 0 0 14px; }
.updbox .acts { display: flex; gap: 8px; }
@media (max-width: 960px) {
  .shell { display: block; }
  .rail { display: none; }
  .top .toc-btn { display: inline-flex; min-height: 38px; padding: 0 12px; font-size: .9rem; }
  .main { padding: 28px 16px calc(110px + env(safe-area-inset-bottom)); }
  .bar {
    display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: rgba(10,13,19,.88); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line-soft);
  }

}
@media (max-width: 420px) {
  .brand span { display: none; }

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
const E = (name, a, b, skill) => ({ name, a, b, skill });
const SRC = {
  plan: `<a href="https://www.youtube.com/watch?v=BEZJxNYR-SU" target="_blank" rel="noopener">The Foolproof Way to Get Rich in WoW Forever</a> by Gillee`,
  prof: `<a href="https://www.youtube.com/watch?v=OB4axTPeB5k" target="_blank" rel="noopener">Best Professions for WoW Forever Launch?</a> by Gillee`,
  dad: `<a href="https://www.youtube.com/watch?v=owZg2FDcpIs" target="_blank" rel="noopener">The Richest Dad Setup in WoW: Forever</a> by The Innkeeper`,
};

// The book, in the order you'll need it: plan, pick professions, level, launch weeks, raid, then reference.
const CHAPTERS = [
  { t: "Start here", d: "How the guide works and the plan behind it.", pages: [
    { t: "Read this first", lede: "The steadiest gold in Classic Era came from raid supplies: herbs, Thorium, Arcane Crystals, Runecloth, elemental drops and enchanting dust. Raiders burn through them every week, so they keep selling.", html: `
      <ul class="notes panel">
        <li>Written from Classic Era knowledge and three WoW Forever videos. There are <b>no live prices</b> here: they differ by server and change every week.</li>
        <li>WoW Forever adds new zones, so some farming spots and demand may shift. <b>Check your own Auction House</b> before you farm.</li>
        <li>In Classic, two gathering professions was the money setup. For Forever, both video creators prefer <b>one gatherer plus Alchemy</b>, with crafting moved to alts. Chapter 2 explains why.</li>
      </ul>` },
    { t: "The gold plan", lede: "Five steps from Gillee's WoW Forever gold guide. Follow them in order.", html: `
      <ol class="notes panel">
        <li><b>Reach max level first.</b> Gold comes much faster at 60, so don't stop at 40 to farm.</li>
        <li><b>Build a nest egg.</b> Gather, fish, farm raw gold or disenchant until you have a starting stack.</li>
        <li><b>Use it as working capital.</b> That gold is for buying materials and items, not for spending.</li>
        <li><b>Make it work.</b> Craft, flip on the Auction House, or buy recipes that sell.</li>
        <li><b>Reinvest profits, never the principal.</b> Spend only what you earn above your nest egg.</li>
      </ol>
      <p class="src">Source: ${SRC.plan}.</p>` },
    { t: "Money habits", lede: "Small habits that stop gold from leaking away.", labels: ["When", "Why"], rows: [
      E("Make a bank alt", "Once you start selling regularly", "It posts and holds stock, so your main keeps playing and your listings earn while you're offline."),
      E("Skip unneeded skills", "Every trainer visit while leveling", "Don't buy every rank; buy what you actually use."),
      E("Count the Auction House costs", "Every post", "The deposit is lost if it doesn't sell, and the AH takes a cut of each sale."),
      E("Check the sale rate", "Before you craft or farm", "A high price is worthless if the item rarely sells."),
      E("Use trade chat too", "Big cities", "Sell crafts and services without paying AH fees."),
    ] },
  ] },
  { t: "Professions", d: "Which professions to take, and when.", pages: [
    { t: "Profession tier list", lede: "The Innkeeper ranks every money method by how well it fits one hour of play a night, not by raw gold. Methods that keep paying while you're offline rank highest.", tiers: [
      { g: "S", c: "var(--gold)", items: [
        ["Skinning", "Pays from the first kill while you quest, with no extra trips."],
        ["The bank-alt factory", "Tailoring and Enchanting on an alt that crafts and posts while your main plays."],
        ["Alchemy at 60", "Potions and elixirs that raiders buy every week."],
      ] },
      { g: "A", c: "var(--cyan)", items: [
        ["Herbalism", "Steady sales to every Alchemist, and it feeds your own Alchemy later."],
        ["Cooking + Fishing", "Raid food and fish sell in big stacks, and both work in short sessions."],
      ] },
      { g: "B", c: "var(--violet)", items: [
        ["Mining", "Sells well, but needs longer farming sessions than a short night allows."],
      ] },
      { g: "Trap", c: "var(--red)", items: [
        ["Blacksmithing, Engineering or Enchanting on your leveling main", "The professions are fine; the timing is the trap. Leveling them on your main eats the gold you need for your mount."],
      ] },
    ], html: `
      <div class="callout"><b>Both videos agree.</b> Gather while you level, take Alchemy for the nest egg, and put crafting on alts. Enchanting is S tier on a bank alt and a trap on your leveling main. Engineering waits until 60.</div>
      <p class="src">Source: ${SRC.dad}. The video gives no gold-per-hour figures; it ranks by time only.</p>` },
    { t: "The best profession route", lede: "Gillee's launch profession plan, as one route from level 1 to raiding.", html: `
      <ol class="notes panel">
        <li><b>Levels 1–34: Skinning + Herbalism.</b> Skin and pick everything as you quest, and sell early herbs while they're at their peak.</li>
        <li><b>Around 34: drop Skinning, learn Alchemy.</b> Level it with herbs you've banked, and keep Herbalism.</li>
        <li><b>At 60: Alchemy builds your nest egg.</b> Potions and elixirs for the raid crowd, from your own herbs.</li>
        <li><b>Then switch to what raids need.</b> He looks at Engineering at 60. Pick whatever your raid role wants.</li>

// Flat page list: 0 is the home page.
const PAGES = [{ home: true, t: "Home" }];
CHAPTERS.forEach((c, ci) => c.pages.forEach(p => { p.ch = ci; CHAPTERS[ci].first ??= PAGES.length; PAGES.push(p); }));

// Phases for the home timeline (dates from The Innkeeper's video).
const PHASES = [
  { when: "Now – Nov 3", what: "Before launch", do: "Read Start here and pick your professions.", go: 0, until: "2026-11-04" },
  { when: "Nov 4 – Dec 8", what: "Launch to 60", do: "Follow the leveling route and sell into the launch rush.", go: 2, until: "2026-12-09" },
  { when: "Dec 9 onward", what: "First raid", do: "Restock raiders and sell your investments.", go: 4, until: "9999-01-01" },
];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
let cur = 0;

function tocHTML() {
  return `<ul class="toc"><li><a class="home pg" href="#0" data-go="0">Home</a></li>${CHAPTERS.map((c, ci) => `
    <li class="chap"><div class="ch-head"><i>${pad(ci + 1)}</i>${esc(c.t)}</div><ul>${c.pages.map(p => {
      const i = PAGES.indexOf(p);
      return `<li><a class="pg" href="#${i}" data-go="${i}">${esc(p.t)}</a></li>`;
    }).join("")}</ul></li>`).join("")}</ul>`;
}

function homeHTML() {
  const today = new Date().toISOString().slice(0, 10);
  const now = PHASES.findIndex(p => today < p.until);
  return `<div class="ph hero"><h1>The Goldsmith's <em>Ledger</em></h1>
    <p class="lede">A gold plan for WoW Forever, from your first herb to the first raid. Built from Classic Era knowledge and three creator videos, with no made-up prices.</p></div>
    <ol class="timeline">${PHASES.map((p, i) => `<li><button class="phase${i === now ? " now" : ""}" data-go="${CHAPTERS[p.go].first}">
      <span class="when">${p.when}</span><span class="what">${p.what}</span><span class="do">${p.do}</span></button></li>`).join("")}</ol>
    <h2 class="sec">Chapters</h2>
    <ul class="chapters panel">${CHAPTERS.map((c, ci) => `<li><button data-go="${c.first}">
      <span class="num">${pad(ci + 1)}</span><span class="t">${esc(c.t)}<span class="d">${esc(c.d)}</span></span><span class="n">${c.pages.length} ${c.pages.length === 1 ? "page" : "pages"}</span></button></li>`).join("")}</ul>`;
}

function pageHTML(i) {
  const p = PAGES[i];
  if (p.home) return homeHTML();
  const lab = p.labels || ["Where", "Used for"];
  let h = `<div class="ph"><h1>${esc(p.t)}</h1>${p.lede ? `<p class="lede">${esc(p.lede)}</p>` : ""}</div>`;
  if (p.tiers) h += `<div class="tiers">${p.tiers.map(t => `<section class="tier panel" style="--c:${t.c}"><div class="tg"${t.g.length > 1 ? ' style="font-size:1.25rem"' : ""}><div>${t.g}<small>tier</small></div></div>
    <ul>${t.items.map(([n, w]) => `<li><b>${esc(n)}</b>${esc(w)}</li>`).join("")}</ul></section>`).join("")}</div>`;
  if (p.rows) h += `<ul class="rows panel">${p.rows.map(r => `<li class="row"><div class="nm"><span>${esc(r.name)}</span>${r.skill ? `<span class="chip">Skill ${r.skill}</span>` : ""}</div>
    <dl><dt>${lab[0]}</dt><dd>${esc(r.a)}</dd><dt>${lab[1]}</dt><dd>${esc(r.b)}</dd></dl></li>`).join("")}</ul>`;
  if (p.html) h += p.html;
  const pv = PAGES[i - 1], nx = PAGES[i + 1];
  h += `<nav class="pager">${pv ? `<button data-go="${i - 1}"><small>Previous</small><span>${esc(pv.t)}</span></button>` : ""}
    ${nx ? `<button class="nx" data-go="${i + 1}"><small>Next</small><span>${esc(nx.t)}</span></button>` : ""}</nav>`;
  return h;
}

const page = $("page");
function show(i, dir = 0) {
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  const swap = () => {
    cur = i;
    page.innerHTML = pageHTML(i);
    const p = PAGES[i];
    $("crumb").innerHTML = p.home ? "" : `${esc(CHAPTERS[p.ch].t)} · <b>${esc(p.t)}</b>`;
    $("progress").style.width = (i / (PAGES.length - 1)) * 100 + "%";
    document.querySelectorAll(".toc [data-go]").forEach(a => +a.dataset.go === i ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    $("prev").disabled = i === 0;
    $("next").disabled = i === PAGES.length - 1;
    window.scrollTo(0, 0);
    if (history.replaceState) history.replaceState(null, "", "#" + i);
    try { localStorage.setItem("ledger-page", String(i)); } catch (e) {}
    if (dir && page.animate) page.animate(
      [{ opacity: 0, transform: `translateX(${dir * 28}px)`, filter: "blur(6px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }],
      { duration: 420, easing: "cubic-bezier(.16,1,.3,1)" });
  };
  if (dir && page.animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    page.animate([{ opacity: 1 }, { opacity: 0, transform: `translateX(${-dir * 20}px)`, filter: "blur(4px)" }], { duration: 140, easing: "ease-in" }).onfinish = swap;
  } else swap();
}
const go = i => { if (i !== cur) show(i, i > cur ? 1 : -1); };

$("rail").innerHTML = tocHTML();
$("sheetToc").innerHTML = tocHTML();
const sheet = $("sheet");
const openSheet = () => { sheet.classList.add("open"); sheet.querySelector(".card [data-close]").focus(); sheet.querySelector('[aria-current]')?.scrollIntoView({ block: "center" }); };
const closeSheet = () => sheet.classList.remove("open");
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); closeSheet(); go(+g.dataset.go); return; }
  if (e.target.closest("[data-close]")) closeSheet();
});
$("home").onclick = () => go(0);
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("toc").onclick = openSheet;
$("tocTop").onclick = openSheet;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeSheet();
  if (sheet.classList.contains("open") || e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
});
let tx = null, ty = null;
page.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
page.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) go(cur + (dx < 0 ? 1 : -1)); // horizontal swipes only
  tx = ty = null;
});

// Updates. The release build stamps VERSION; the published page keeps the placeholder and never checks.
const VERSION = "__VERSION__";
const REPO = "Pixcel-Pirate/Gold-Maker";
const DESKTOP = location.hostname === "127.0.0.1";
const INSTALLER = `https://github.com/${REPO}/releases/latest/download/Goldsmiths-Ledger-Setup.exe`;

async function reloadFresh() {
  if (window.caches) await Promise.all((await caches.keys()).map(k => caches.delete(k)));
  location.reload();
}
if (!VERSION.startsWith("__")) {
  fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
    .then(r => (r.ok ? r.json() : null))
    .then(j => {
      const tag = j && j.tag_name;
      if (typeof tag !== "string" || !/^v\d{4}\.\d{2}\.\d{2}(\.\d+)?$/.test(tag) || tag === VERSION) return;
      $("updText").textContent = `${tag} is ready (you have ${VERSION}). ` + (DESKTOP ? "Update downloads the new installer." : "Update reloads the Ledger with the new version.");
      $("updbox").hidden = false;
    })
    .catch(() => {});
}
function update() {
  if (!DESKTOP) return reloadFresh();
  // Desktop: download the new installer; running it replaces the app in place.
  $("updTitle").textContent = "Almost done";
  $("updText").textContent = "When the download finishes, close the Ledger and run Goldsmiths-Ledger-Setup.exe. Your place in the book is kept.";
  $("updbox").querySelector(".acts").hidden = true;
  $("updbox").hidden = false;
  location.href = INSTALLER;
}
$("updNow").onclick = update;
$("upd").onclick = update;
$("updLater").onclick = () => { $("updbox").hidden = true; $("upd").classList.add("show"); };

let start = parseInt(location.hash.slice(1), 10);
if (isNaN(start)) try { start = +localStorage.getItem("ledger-page") || 0; } catch (e) { start = 0; }
show(start || 0);
</script>
</body></html>
